<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sugar Shapes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- app-meta -->
<meta name="theme-color" content="#ff5c8d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sugar Shapes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Fonts ship with the game so it works offline (SIL Open Font License, see fonts/). */
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/LilitaOne-latin.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:200 1000;font-display:swap;src:url(fonts/Nunito-latin.woff2) format('woff2')}
</style>
<!-- /app-meta -->
<style>
/* Layout: one-screen arcade stage. HUD and goals over a chocolate board, strawberry-sunset sky behind. */
:root{
  --sky-top:#ff5c8d; --sky-mid:#ff7f6e; --sky-bot:#ffb04f;
  --choc:#3b1824; --choc-2:#58263c; --choc-edge:#240d16;
  --cream:#fff3e3; --cream-dim:#f6d2c6;
  --gold:#ffd23f; --gold-deep:#b86b00; --berry:#e8336d; --berry-deep:#8c1240;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sky-mid);color:var(--cream);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:manipulation}
#bg,#game{position:fixed;inset:0;display:block}
#bg{z-index:0}
#game{z-index:2;pointer-events:none}
#app{position:fixed;inset:0;z-index:1;display:flex;justify-content:center;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;gap:10px;visibility:hidden}
.stage.on{visibility:visible}

/* HUD */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.card{background:linear-gradient(var(--choc-2),var(--choc));border:2px solid rgba(255,243,227,.14);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--choc-edge),0 10px 24px rgba(90,10,40,.25);min-width:0}
.lvl{display:flex;align-items:center;gap:10px}
.mini-logo{width:46px;height:auto;flex:none;fill:var(--cream)}
.lbl{display:block;font:800 11px/1.1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim)}
.val{display:block;font:400 26px/1.05 var(--display);color:var(--cream);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.moves{width:86px;height:86px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(circle at 34% 28%,#ff9cc0,var(--berry) 55%,#a5154a);border:4px solid var(--cream);
  box-shadow:0 5px 0 var(--berry-deep),0 12px 26px rgba(120,10,50,.35)}
.moves .val{font-size:36px}
.moves .lbl{color:#ffe3ec}
.moves.low{animation:throb .8s ease-in-out infinite}
.starbar{position:relative;height:10px;border-radius:6px;background:rgba(0,0,0,.35);margin:8px 8px 2px 0}
.starbar .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:linear-gradient(90deg,var(--gold),#ff9f1c)}
.mk{position:absolute;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);fill:rgba(255,243,227,.3);stroke:var(--choc-edge);stroke-width:1.5}
.mk.lit{fill:var(--gold);animation:pop .45s cubic-bezier(.3,1.8,.5,1)}

.goals{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:46px}
.goal{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;border-radius:999px;background:linear-gradient(var(--choc-2),var(--choc));border:2px solid rgba(255,243,227,.14);box-shadow:0 3px 0 var(--choc-edge)}
.goal img{width:34px;height:34px;display:block}
.goal .n{font:400 22px/1 var(--display);font-variant-numeric:tabular-nums}
.goal .ok{display:none;width:22px;height:22px;fill:none;stroke:#7dffb0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.goal.done .n{display:none}
.goal.done .ok{display:block}
.goal.bump{animation:bump .22s ease-out}

.board-wrap{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#board{outline:none;border-radius:14px;touch-action:none;cursor:pointer}
#board.kb:focus-visible{outline:3px solid var(--gold);outline-offset:18px}

.controls{display:flex;justify-content:center;gap:6px}
.controls .icon-btn{width:auto;height:auto;aspect-ratio:1;flex:0 1 50px;min-width:0}
.boost{position:relative;flex:0 1 50px;min-width:0;aspect-ratio:1;border-radius:16px;border:2px solid rgba(255,243,227,.18);background:linear-gradient(var(--choc-2),var(--choc));box-shadow:0 4px 0 var(--choc-edge);padding:3px;cursor:pointer;display:grid;place-items:center;color:var(--gold)}
.boost img{width:100%;height:100%;object-fit:contain;display:block}
.boost .cnt{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--berry);color:#fff;font:400 13px/20px var(--display);box-shadow:0 2px 0 var(--berry-deep)}
.boost .plus5{font:400 21px/1 var(--display);color:var(--gold);text-shadow:0 2px 0 var(--choc-edge)}
.boost.empty{opacity:.5}
.boost.empty .cnt{background:#7a5a66;box-shadow:none}
.boost.aim{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--choc-edge);animation:throb .8s ease-in-out infinite}
.boost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--choc-edge)}
.boost.bump,.xchip.bump{animation:bump .3s ease-out}
.extras{display:flex;justify-content:center;gap:10px;min-height:38px}
.xchip{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 5px;border-radius:999px;background:rgba(59,24,36,.72);border:2px solid rgba(255,243,227,.12)}
.xchip img{width:30px;height:30px;display:block}
.xchip .n{font:400 18px/1 var(--display);font-variant-numeric:tabular-nums}
.mbar{position:relative;width:74px;height:11px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}
.mbar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:linear-gradient(90deg,#ff3b5c,#ff9419,#ffd92e,#35d05e,#2f9bff,#a752f5);transition:width .25s}
.meter.full{box-shadow:0 0 0 3px var(--gold);animation:throb .6s ease-in-out infinite}
.icon-btn{width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,243,227,.18);background:linear-gradient(var(--choc-2),var(--choc));color:var(--cream);display:grid;place-items:center;box-shadow:0 4px 0 var(--choc-edge);cursor:pointer;padding:0;position:relative}
.icon-btn svg{width:24px;height:24px;fill:currentColor}
.icon-btn .slash{display:none;position:absolute;width:30px;height:3px;border-radius:2px;background:var(--berry);transform:rotate(-45deg);box-shadow:0 0 0 2px var(--choc)}
.icon-btn.off .slash{display:block}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--choc-edge)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Screens */
.screen{position:fixed;inset:0;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.on{display:flex}
.logo-big{width:min(300px,68vw);height:auto;overflow:visible}
.logo-big .back>*{fill:var(--cream);stroke:var(--cream);stroke-width:80;stroke-linejoin:round}
.logo-big .front>*{fill:var(--choc)}
.logo-big .back>*,.logo-big .front>*{transform-box:fill-box;transform-origin:50% 100%;animation:drop .75s cubic-bezier(.3,1.5,.5,1) both}
.logo-big :nth-child(1){animation-delay:.05s}
.logo-big :nth-child(2){animation-delay:.15s}
.logo-big :nth-child(3){animation-delay:.25s}
.logo-big :nth-child(4){animation-delay:.35s}
.logo-big :nth-child(5){animation-delay:.45s}
.title-name{margin:0;font:400 clamp(46px,13vw,84px)/.95 var(--display);color:var(--cream);letter-spacing:.01em;text-wrap:balance;
  text-shadow:0 3px 0 var(--choc),0 6px 0 var(--choc),0 9px 0 var(--choc-edge),0 18px 28px rgba(90,10,40,.35)}
.tagline{margin:0;font:800 16px/1.4 var(--body);color:var(--choc);max-width:30ch}
.candy-row{display:flex;gap:6px}
.candy-row img{width:44px;height:44px;animation:bob 1.6s ease-in-out infinite}
.candy-row img:nth-child(2){animation-delay:-.25s}.candy-row img:nth-child(3){animation-delay:-.5s}
.candy-row img:nth-child(4){animation-delay:-.75s}.candy-row img:nth-child(5){animation-delay:-1s}.candy-row img:nth-child(6){animation-delay:-1.25s}
.how{margin:0;font:700 13px/1.5 var(--body);color:var(--choc);opacity:.85;max-width:36ch}

.btn{font:400 22px/1 var(--display);letter-spacing:.02em;padding:14px 26px;border-radius:999px;border:none;cursor:pointer;color:var(--choc);
  background:linear-gradient(#ffeb99,var(--gold) 50%,#f5a800);box-shadow:0 5px 0 var(--gold-deep),0 12px 22px rgba(120,40,0,.28);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep)}
.btn.ghost{background:linear-gradient(var(--choc-2),var(--choc));color:var(--cream);box-shadow:0 5px 0 var(--choc-edge)}
.btn.ghost:active{box-shadow:0 1px 0 var(--choc-edge)}
.btn.big{font-size:32px;padding:18px 54px;animation:breathe 2.2s ease-in-out infinite}

#scrMap{justify-content:flex-start;gap:12px}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:560px}
.map-head h2{margin:0;font:400 34px/1 var(--display);text-shadow:0 3px 0 var(--choc),0 6px 0 var(--choc-edge)}
.star-total{display:flex;align-items:center;gap:6px;font:400 22px/1 var(--display);background:linear-gradient(var(--choc-2),var(--choc));padding:8px 14px;border-radius:999px;box-shadow:0 3px 0 var(--choc-edge)}
.star-total svg{width:22px;height:22px;fill:var(--gold)}
.map-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px 12px;width:100%;max-width:560px;flex:1;min-height:0;overflow-y:auto;padding:10px 6px 30px;touch-action:pan-y;align-content:start}
.lv{position:relative;aspect-ratio:1;max-width:100%;border:none;border-radius:50%;cursor:pointer;font:400 clamp(20px,6vw,28px)/1 var(--display);color:var(--choc);
  background:radial-gradient(circle at 34% 28%,#fff3b0,var(--gold) 50%,#e89400);box-shadow:0 5px 0 var(--gold-deep),0 10px 18px rgba(120,40,0,.25)}
.lv .st{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);display:flex;gap:1px}
.lv .st svg{width:15px;height:15px;fill:rgba(59,24,36,.45);stroke:var(--choc-edge);stroke-width:1.5}
.lv .st svg.on{fill:var(--gold)}
.lv.locked{background:rgba(59,24,36,.55);color:rgba(255,243,227,.45);box-shadow:0 4px 0 rgba(36,13,22,.6);cursor:not-allowed}
.lv.locked svg.lock{width:40%;height:40%;fill:rgba(255,243,227,.5)}
.lv.current{animation:throb 1.3s ease-in-out infinite}
.lv:active:not(.locked){transform:translateY(3px)}

/* Modal */
.modal-back{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:rgba(36,13,22,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{width:min(390px,100%);background:linear-gradient(var(--choc-2),var(--choc));border:3px solid rgba(255,243,227,.2);border-radius:28px;padding:40px 22px 24px;text-align:center;position:relative;
  box-shadow:0 8px 0 var(--choc-edge),0 30px 60px rgba(30,0,15,.5);animation:modalIn .45s cubic-bezier(.3,1.4,.5,1) both}
.ribbon{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:linear-gradient(#ff7aa6,var(--berry));color:#fff;font:400 24px/1 var(--display);padding:12px 28px;border-radius:14px;box-shadow:0 4px 0 var(--berry-deep);white-space:nowrap}
.modal h3{margin:4px 0 6px;font:400 26px/1.15 var(--display);text-wrap:balance}
.modal p{margin:6px 0;font:700 16px/1.45 var(--body);color:var(--cream-dim)}
.modal .score-big{font:400 44px/1 var(--display);color:var(--cream);font-variant-numeric:tabular-nums;margin:6px 0 2px}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.modal .goal-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.modal .goal-row .goal{background:rgba(0,0,0,.22);box-shadow:none}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:2px 0 4px}
.stars svg{width:64px;height:64px;fill:rgba(0,0,0,.3);stroke:rgba(255,243,227,.15);stroke-width:1}
.stars svg:nth-child(2){width:80px;height:80px;transform:translateY(-10px)}
.stars svg.on{fill:var(--gold);stroke:var(--gold-deep);animation:starIn .55s cubic-bezier(.3,1.7,.5,1) both}
.stars svg:nth-child(2).on{animation-name:starIn2}
.toggles{display:flex;gap:12px;justify-content:center;margin-top:16px}

@keyframes drop{0%{transform:translateY(-140%) scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes modalIn{0%{transform:scale(.7) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
@keyframes starIn2{0%{transform:translateY(-10px) scale(0) rotate(-40deg)}100%{transform:translateY(-10px)}}
@media (max-width:420px){
  .moves{width:74px;height:74px}.moves .val{font-size:30px}
  .val{font-size:22px}.mini-logo{width:36px}.card{padding:7px 10px}
  .lvl{gap:7px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div id="app">
  <main class="stage" id="stage">
    <header class="hud">
      <div class="card lvl">
        <svg class="mini-logo" viewBox="30 12 1804 1130" aria-hidden="true"><circle cx="340" cy="322" r="301"/><circle cx="1523" cy="322" r="301"/><circle cx="633" cy="835" r="297"/><polygon points="930,41 1210,582 648,582"/><polygon points="946,564 1509,564 1228,1105"/></svg>
        <div><span class="lbl">Level</span><span class="val" id="hudLevel">1</span></div>
      </div>
      <div class="moves" id="movesBadge"><span class="lbl">Moves</span><span class="val" id="hudMoves">0</span></div>
      <div class="card score">
        <span class="lbl">Score</span><span class="val" id="hudScore">0</span>
        <div class="starbar" id="starbar"><div class="fill" id="barFill"></div></div>
      </div>
    </header>
    <div class="goals" id="goals" aria-live="polite"></div>
    <div class="extras">
      <div class="xchip" id="chest" role="img" aria-label="Sugar chest"><img alt="" id="chestImg"><span class="n" id="chestN">0/3</span></div>
      <div class="xchip meter" id="meter" role="img" aria-label="Rainbow meter"><img alt="" id="meterImg"><span class="mbar"><i id="meterFill"></i></span></div>
    </div>
    <div class="board-wrap" id="boardWrap">
      <div id="board" tabindex="0" role="application" aria-label="Candy board. Drag a candy onto a neighbour, or use the arrow keys and Enter to pick and swap."></div>
    </div>
    <footer class="controls" id="controls">
      <button class="icon-btn" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></svg></button>
    </footer>
  </main>
</div>

<canvas id="game" aria-hidden="true"></canvas>

<section class="screen on" id="scrTitle" aria-label="Title">
  <svg class="logo-big" viewBox="30 12 1804 1130" role="img" aria-label="Sugar Shapes logo">
    <g class="back"><circle cx="340" cy="322" r="301"/><polygon points="930,41 1210,582 648,582"/><circle cx="1523" cy="322" r="301"/><circle cx="633" cy="835" r="297"/><polygon points="946,564 1509,564 1228,1105"/></g>
    <g class="front"><circle cx="340" cy="322" r="301"/><polygon points="930,41 1210,582 648,582"/><circle cx="1523" cy="322" r="301"/><circle cx="633" cy="835" r="297"/><polygon points="946,564 1509,564 1228,1105"/></g>
  </svg>
  <h1 class="title-name">Sugar Shapes</h1>
  <div class="candy-row" id="candyRow"></div>
  <button class="btn big" id="btnPlay">Play</button>
  <p class="how">Swap two neighbouring candies to line up three or more. Every candy is the logo. Four in a row makes a striped candy, a 2&times;2 box makes a seeker, an L or T makes a wrapped one, and five or six makes a rainbow. Gold keys open chests full of power-ups.</p>
</section>

<section class="screen" id="scrMap" aria-label="Levels">
  <div class="map-head">
    <button class="icon-btn" id="btnBack" aria-label="Back to title"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2>Levels</h2>
    <div class="star-total"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z"/></svg><span id="starTotal">0</span></div>
  </div>
  <div class="map-grid" id="mapGrid"></div>
</section>

<div class="modal-back" id="modalBack" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = n => Math.floor(Math.random() * n);
const fmt = n => Math.round(n).toLocaleString('en-US');
const Ease = {
  linear: t => t,
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inOutQuad: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rrPath(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();

    <p>${state.score > prevBest && prevBest ? 'New best score' : prevBest ? `Best ${fmt(Math.max(prevBest, state.score))}` : 'First clear'}</p>
    ${bonus ? `<div class="goal-row"><div class="goal"><img alt="" src="${iconSrc('boost', bonus)}"><span class="n">+1 ${BOOST[bonus].name}</span></div></div>` : ''}
    <div class="row"><button class="btn ghost" data-act="map">Levels</button><button class="btn ghost" data-act="retry">Replay</button>${n < LEVEL_COUNT ? '<button class="btn gold" data-act="next">Next level</button>' : ''}</div>`);
  const els = modal.querySelectorAll('.stars svg');
  for (let i = 0; i < stars; i++) after(.45 + i * .38, () => { els[i] && els[i].classList.add('on'); SFX.star(i); const r = els[i] && els[i].getBoundingClientRect(); if (r) burst(r.left + r.width / 2, r.top + r.height / 2, 2, 1.6); });
}
function levelLost() {
  SFX.lose();
  const missing = state.goals.filter(g => g.kind === 'score' ? state.score < g.need : g.left > 0).map(g =>
    g.kind === 'score' ? `${fmt(g.need - state.score)} more points` : g.kind === 'jelly' ? `${g.left} jelly left` : `${g.left} ${CANDY[g.type].name} left`);
  openModal(`<div class="ribbon" id="modalTitle">Out of moves</div>
    <h3>So close</h3><p>You needed ${missing.join(' and ')}.</p>
    <div class="score-big">${fmt(state.score)}</div>
    <div class="row"><button class="btn ghost" data-act="map">Levels</button><button class="btn gold" data-act="retry">Try again</button></div>`);
}
function openPause() {
  if (screen !== 'game' || !modalBack.hidden) return;
  paused = true; SFX.click();
  openModal(`<div class="ribbon" id="modalTitle">Paused</div>
    <h3>Level ${L.n}</h3><p>${goalSentence().replace(/in <b>\d+<\/b> moves\./, `with <b>${state.moves}</b> moves left.`)}</p>
    <div class="toggles"><button class="icon-btn" id="btnSfx" data-act="sfx" aria-label="Sound effects"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><i class="slash"></i></button><button class="icon-btn" id="btnMusic" data-act="music" aria-label="Music"><svg viewBox="0 0 24 24"><path d="M9 17.5V6l11-2.5v11.5"/><circle cx="6.5" cy="17.5" r="3"/><circle cx="17.5" cy="15" r="3"/><path d="M9 6l11-2.5V8L9 10.5z"/></svg><i class="slash"></i></button></div>
    <div class="row"><button class="btn ghost" data-act="map">Levels</button><button class="btn ghost" data-act="retry">Restart</button><button class="btn gold" data-act="resume">Resume</button></div>`);
  syncToggles();
}
modal.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  SFX.init(); SFX.click();
  const a = b.dataset.act;
  if (a === 'start') { closeModal(); beginLevel(); }
  else if (a === 'resume') { closeModal(); paused = false; }
  else if (a === 'retry') startLevel(L.n);
  else if (a === 'next') startLevel(Math.min(LEVEL_COUNT, L.n + 1));
  else if (a === 'map') { resetWorld(); showScreen('map'); }
  else if (a === 'sfx') { save.sfx = !save.sfx; SFX.setSfx(save.sfx); persist(); syncToggles(); }
  else if (a === 'music') { save.music = !save.music; SFX.setMusic(save.music); persist(); syncToggles(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (aim) { aim = null; sel = null; updateBoosters(); } else if (!modalBack.hidden && paused) { closeModal(); paused = false; } else if (screen === 'game') openPause(); }
});

/* ---------- level lifecycle ---------- */
function setupLevel(n) {
  resetWorld();
  L = makeLevel(n);
  const pat = L.jelly ? PAT[L.jelly] : null;
  jelly = []; jwob = []; let jt = 0;
  for (let r = 0; r < ROWS; r++) { jelly.push([]); jwob.push([]); for (let c = 0; c < COLS; c++) { const v = pat ? pat(r, c) : 0; jelly[r].push(v); jwob[r].push(0); jt += v; } }
  state = { score: 0, shown: 0, moves: L.moves, busy: true, over: false, starsLit: 0, meter: 0, rainbows: 0, chest: { need: 3, have: 0, shownHave: 0, pending: 0 },
    goals: L.goals.map(g => g[0] === 'score' ? { kind: 'score', need: g[1] } : g[0] === 'collect' ? { kind: 'collect', type: g[1], need: g[2], left: g[2], shown: g[2] } : { kind: 'jelly', need: jt, left: jt, shown: jt }) };
  shownScoreText = '';
}
function startLevel(n) {
  setupLevel(n);
  genBoard();
  grid.forEach(row => row.forEach(t => { t.y = t.r - ROWS - .6; }));
  showScreen('game');
  buildStarbar(); buildGoals(); updateHUD(); updateMeter(); updateChest(); updateBoosters();
  openIntro();
}
async function beginLevel() {
  SFX.whoosh();
  grid.forEach(row => row.forEach(t => { t.falling = true; t.vy = 0; t.delay = .05 + t.c * .035 + (ROWS - 1 - t.r) * .045; }));
  await waitFor(() => !anyFalling());
  state.busy = false; idleT = 0;
  boardEl.focus({ preventScroll: true });
}

/* ---------- input ---------- */
let drag = null;
function cellAt(x, y) {
  const c = Math.floor((x - BR.x) / BR.cs), r = Math.floor((y - BR.y) / BR.cs);
  return r >= 0 && r < ROWS && c >= 0 && c < COLS ? { r, c } : null;
}
boardEl.addEventListener('pointerdown', e => {
  SFX.init(); kbOn = false; boardEl.classList.remove('kb');
  if (!canPlay()) return;
  const cell = cellAt(e.clientX, e.clientY); if (!cell) return;
  drag = { ...cell, x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
  try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
});
boardEl.addEventListener('pointermove', e => {
  if (!drag || drag.moved || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, th = BR.cs * .3;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  drag.moved = true;
  const b = Math.abs(dx) > Math.abs(dy) ? { r: drag.r, c: drag.c + Math.sign(dx) } : { r: drag.r + Math.sign(dy), c: drag.c };
  if (aim && aim.id !== 'swap') { drag.moved = false; return; }
  const free = !!aim; if (free) { aim = null; updateBoosters(); }
  sel = null; attemptSwap({ r: drag.r, c: drag.c }, b, free);
});
boardEl.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.moved && canPlay()) tap(d);
});
boardEl.addEventListener('pointercancel', () => { drag = null; });
function tap(cell) {
  idleT = 0; hint = null;
  if (aim) { aimTap(cell); return; }
  if (sel) {
    if (sel.r === cell.r && sel.c === cell.c) { sel = null; return; }
    if (Math.abs(sel.r - cell.r) + Math.abs(sel.c - cell.c) === 1) { const a = sel; sel = null; attemptSwap(a, cell); return; }
  }
  sel = { r: cell.r, c: cell.c }; const t = grid[cell.r][cell.c]; if (t) t.bsv += 4; SFX.select(); buzz(5);
}
boardEl.addEventListener('keydown', e => {
  const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
  if (!d && e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault(); SFX.init(); kbOn = true; boardEl.classList.add('kb');
  if (!canPlay()) return;
  if (d) {
    if (sel) { const a = sel; sel = null; const b = { r: a.r + d[0], c: a.c + d[1] }; cursor = { r: clamp(b.r, 0, ROWS - 1), c: clamp(b.c, 0, COLS - 1) }; attemptSwap(a, b); }
    else cursor = { r: clamp(cursor.r + d[0], 0, ROWS - 1), c: clamp(cursor.c + d[1], 0, COLS - 1) };
  } else tap({ ...cursor });
});

/* ---------- buttons ---------- */
function syncToggles() {
  const sfx = $('#btnSfx'), mus = $('#btnMusic');
  if (sfx) { sfx.classList.toggle('off', !save.sfx); sfx.setAttribute('aria-pressed', String(save.sfx)); }
  if (mus) { mus.classList.toggle('off', !save.music); mus.setAttribute('aria-pressed', String(save.music)); }
}
$('#btnPause').addEventListener('click', () => { SFX.init(); openPause(); });
$('#btnPlay').addEventListener('click', () => { SFX.init(); SFX.click(); showScreen('map'); });
$('#btnBack').addEventListener('click', () => { SFX.click(); showScreen('title'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { SFX.suspend(); if (screen === 'game' && !state.over) openPause(); } else SFX.resume(); });
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => layoutBoard()).observe(wrapEl);

/* ---------- boot ---------- */
$('#candyRow').innerHTML = CANDY.map((c, i) => `<img alt="" src="${iconSrc('c', i)}">`).join('');
$('#chestImg').src = iconSrc('chest', ''); $('#meterImg').src = iconSrc('bomb', '');
if (!save.boosters || typeof save.boosters !== 'object') save.boosters = { hammer: 3, swap: 3, rainbow: 2, swarm: 2, moves: 2, party: 1 };
buildBoosters();
syncToggles();
resize();
if (document.fonts && document.fonts.load) document.fonts.load('40px "Lilita One"').catch(() => {});
requestAnimationFrame(frame);

window.claude?.hot?.snapshot?.(() => ({
  save, screen, level: L && L.n, score: state.score, moves: state.moves,
  board: screen === 'game' && L ? grid.map(row => row.map(t => t ? [t.type, t.special > 0 ? t.special : 0, t.key ? 1 : 0] : null)) : null,
  jelly, goals: state.goals.map(g => g.left),
}));
function boot(data) {
  try {
    if (data && data.save) { save = Object.assign(save, data.save); syncToggles(); }
    if (data && data.screen === 'game' && data.level && data.board && !data.over) {
      setupLevel(data.level);
      grid = data.board.map((row, r) => row.map((v, c) => { const t = mkTile(v ? v[0] : randType(), v ? v[1] : 0); t.key = !!(v && v[2]); t.r = r; t.c = c; t.x = c; t.y = r; return t; }));
      if (data.jelly) jelly = data.jelly;
      state.score = state.shown = data.score || 0; state.moves = data.moves || L.moves;
      (data.goals || []).forEach((v, i) => { const g = state.goals[i]; if (g && g.kind !== 'score') { g.left = g.shown = v; } });
      showScreen('game'); buildStarbar(); buildGoals(); updateHUD(); updateMeter(); updateChest(); updateBoosters();
      state.busy = false;
      return;
    }
    if (data && data.screen === 'map') { showScreen('map'); return; }
  } catch (e) {}
  showScreen('title');
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
// offline support when installed to the home screen from a website (not used inside the native app or an embed)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.self === window.top) navigator.serviceWorker.register('sw.js').catch(() => {});

// lightweight hooks for automated play-testing
window.__sugar = { moves: () => allMoves(), swap: (a, b) => attemptSwap(a, b), state: () => ({ ...state, goals: state.goals.map(g => ({ kind: g.kind, left: g.left, need: g.need })) }), canPlay: () => canPlay(), start: n => startLevel(n), boost: id => useBooster(id), setTile: (r, c, type, special = 0, key = false) => { const t = grid[r][c]; t.type = type; t.special = special; t.key = key; }, aimTap: (r, c) => tap({ r, c }), grid: () => grid.map(row => row.map(t => t ? [t.type, t.special, t.key ? 1 : 0] : null)), sprite: (t, s, S = 160) => (s === BOMB ? makeBomb(S) : makeCandy(t, s, S)).toDataURL(), icon: (k, t) => iconSrc(k, t), begin: () => { closeModal(); beginLevel(); } };
})();
</script>
