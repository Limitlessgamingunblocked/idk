# Generates SugarShapes.xcodeproj:  brew install xcodegen && cd ios && xcodegen generate
name: SugarShapes
options:
  bundleIdPrefix: io.github.limitlessgamingunblocked
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  SugarShapes:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: SugarShapes
      # the game itself, shared with the web version at the repo root
      - path: ../index.html
        buildPhase: resources
      - path: ../fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.limitlessgamingunblocked.sugarshapes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SugarShapes/Info.plist
      properties:
        CFBundleDisplayName: Sugar Shapes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
